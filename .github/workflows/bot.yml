name: paper-bot

on:
  schedule:
    - cron: "7 * * * *"        # κάθε ώρα· κάθε γύρος τρέχει ~55 λεπτά
  workflow_dispatch: {}          # χειροκίνητη εκκίνηση από το κινητό (Actions → paper-bot → Run workflow)
  push:
    branches: [main]
    paths: ["bot/engine.py", "bot/data.py", "bot/run.py", "bot/report.py", ".github/workflows/bot.yml"]

permissions:
  contents: write
  actions: write                 # για να ξεκινά μόνο του τον επόμενο γύρο

concurrency:
  group: paper-bot
  cancel-in-progress: false      # ποτέ δύο bots ταυτόχρονα

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install -q pytest
          python -m pytest -q

      - name: Run bot (paper only)
        env:
          RUN_MINUTES: "55"
          COMMIT_EVERY: "5"
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          python -m bot.run

      # Το cron του GitHub συχνά καθυστερεί ώρες ή παραλείπει γύρους.
      # Γι' αυτό κάθε γύρος ξεκινά αμέσως τον επόμενο (αλυσίδα). Το cron μένει ως εφεδρεία.
      - name: Επόμενος γύρος
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
